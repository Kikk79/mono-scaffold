[project]
name = "__PROJECT__"
version = "0.1.0"
description = "__TITLE__ – modularer Monolith (FastAPI, SQLAlchemy 2.0, PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: deutsche Texte enthalten Gedankenstriche und Anführungszeichen, das ist gewollt.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# Der Ordner alembic/ im Projekt ist nicht das Paket alembic.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

# ---------------------------------------------------------------------------
# Modulgrenzen. Quelle der Wahrheit ist die Tabelle in docs/module-grenzen.md;
# `mono module …` und `mono contracts` erzeugen den Block zwischen den Markern.
# Prüfung: `uv run lint-imports` (Teil von scripts/check.sh).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["app"]

# mono:contracts-begin
# mono:contracts-end
