name: gate

# Läuft bei Pull Requests, nächtlich und von Hand (`gh workflow run gate.yml`),
# nicht bei jedem Push (Minutenkontingent).
on:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: __PROJECT_SNAKE___test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://postgres:ci@127.0.0.1:5432/__PROJECT_SNAKE___test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci@127.0.0.1:5432/__PROJECT_SNAKE___test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen || uv sync
      - run: bash scripts/check.sh
