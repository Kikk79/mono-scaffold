name: __PROJECT_SNAKE__

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: __PROJECT_SNAKE__
      POSTGRES_USER: postgres
      # Pflicht aus .env; kein Default im Repo.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d __PROJECT_SNAKE__"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
