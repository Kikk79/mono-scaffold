[project]
name = "mono-scaffold"
version = "0.1.0"
description = "Generator für modulare Monolithen nach dem Muster des Silatec-ERP: `mono new` legt das Grundgerüst an, `mono module` ein Fachmodul."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mono = "mono_scaffold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mono_scaffold"]

[tool.ruff]
target-version = "py312"
line-length = 100
